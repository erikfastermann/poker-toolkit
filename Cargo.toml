[workspace]
members = [
    "poker-core",
    "poker-gui",
    "poker-app",
    "gto-wizard-crawler",
    "poker-ai/analyze-sizings",
    "poker-ai/poker-human",
    "poker-ai/generate-hands",
]
resolver = "2"

[workspace.dependencies]
rand = { version = "0.8.5", features = ["small_rng"] }
regex = "1.11.1"
chrono = { version = "0.4.41", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
serde-xml-rs = "0.8.2"
serde_with = "3.12.0"
eframe = { version = "0.31.1", features = ["default"] }
egui_extras = { version = "0.31.1", features = ["default", "image"] }
env_logger = "0.11.7"
rusqlite = { version = "0.35.0", features = ["bundled", "chrono", "functions"] }
toml = { version = "0.9.5", features = ["preserve_order"] }
toml_edit = "0.23.4"
walkdir = "2.5.0"
